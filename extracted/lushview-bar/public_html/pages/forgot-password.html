<!DOCTYPE html>
<html lang="en" class="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — Lush View Bar</title>
  <meta name="description" content="Reset your Lush View Bar account password.">
  <link rel="stylesheet" href="../assets/css/app.css">
  <link rel="stylesheet" href="../assets/css/tailwind.css">
  <script>try{if(localStorage.getItem('sf_theme')==="dark"){document.documentElement.classList.add("dark")}else{document.documentElement.classList.remove("dark")}}catch(e){}</script>
</head>
<body class="auth-body">
  <div class="w-full max-w-[420px]">
    <div class="text-center mb-7">
      <a href="login.html" class="auth-back-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        Back to Sign In
      </a>
    </div>
    <div class="auth-card text-center">
      <div class="stat-icon icon-bg-primary w-16 h-16 rounded-[20px] mx-auto mb-5">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>
      <h1 class="auth-title">Forgot Password?</h1>
      <p class="auth-subtitle leading-relaxed mb-7">No worries! Enter your email address and we'll send you reset instructions.</p>
      <form id="forgot-form" class="flex flex-col gap-4 text-left">
        <div>
          <label class="form-label" for="forgot-email">Email Address</label>
          <input id="forgot-email" type="email" class="form-input" placeholder="john@company.com" required>
        </div>
        <button type="submit" class="btn btn-primary btn-lg w-full justify-center">
          Send Reset Instructions
        </button>
      </form>
    </div>
  </div>
  <div id="toast-container" class="fixed bottom-5 right-5 z-[200] flex flex-col gap-2.5"></div>
  <script src="../assets/js/app.js"></script>
  <script>
    (function() { try { if (localStorage.getItem('sf_theme') === 'dark') document.documentElement.classList.add('dark'); } catch(e) {} })();
    document.addEventListener('DOMContentLoaded', () => Toast.init());
    document.getElementById('forgot-form').addEventListener('submit', function(e) {
      e.preventDefault();
      Toast.success('Reset instructions sent to your email!', 'Email Sent');
      setTimeout(() => window.location.href = 'reset-password.html', 1500);
    });
  </script>
</body>
</html>
