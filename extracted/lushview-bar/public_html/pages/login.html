<!DOCTYPE html>
<html lang="en" class="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Lush View Bar</title>
  <meta name="description" content="Sign in to Lush View Bar — POS & Inventory.">
  <link rel="stylesheet" href="../assets/css/app.css">
  <link rel="stylesheet" href="../assets/css/tailwind.css">
  <script>try{if(localStorage.getItem('sf_theme')==="dark"){document.documentElement.classList.add("dark")}else{document.documentElement.classList.remove("dark")}}catch(e){}</script>
</head>
<body class="auth-body">
  <!-- Animated background elements -->
  <div class="auth-bg-shape auth-bg-shape-1"></div>
  <div class="auth-bg-shape auth-bg-shape-2"></div>
  <div class="auth-bg-shape auth-bg-shape-3"></div>

  <div class="w-full max-w-[440px] relative z-[1]">
    <!-- Logo -->
    <div class="text-center mb-8">
      <div class="auth-logo-wrap inline-flex items-center gap-3">
        <div class="w-[44px] h-[44px] rounded-xl bg-gradient-to-br from-[#E11D48] to-[#BE123C] flex items-center justify-center shadow-[0_4px_14px_rgba(225,29,72,0.35)]">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L3 7v10l9 5 9-5V7l-9-5z" fill="white" fill-opacity="0.2"/>
            <path d="M12 2L3 7v10l9 5 9-5V7l-9-5z" stroke="white" stroke-width="1.5" stroke-linejoin="round"/>
            <path d="M12 22V12" stroke="white" stroke-width="1.5" stroke-linejoin="round"/>
            <path d="M3 7l9 5 9-5" stroke="white" stroke-width="1.5" stroke-linejoin="round"/>
            <circle cx="12" cy="12" r="2.5" fill="white" stroke="white" stroke-width="0.5"/>
          </svg>
        </div>
        <div class="text-left border-l border-[var(--border)] pl-3">
          <div class="text-xl font-bold text-[var(--text)] leading-[1.1] tracking-[-0.3px]">Lush View Bar</div>
          <div class="text-[10px] text-[var(--primary)] font-semibold tracking-[0.8px] uppercase mt-0.5">Inventory Management</div>
        </div>
      </div>
    </div>

    <!-- Card -->
    <div class="auth-card animate-[slideUp_0.6s_cubic-bezier(0.4,0,0.2,1)]">
      <div class="text-center mb-7">
        <h1 class="auth-title">Welcome back!</h1>
        <p class="auth-subtitle">Sign in to your Lush View Bar account.</p>
      </div>

      <form id="login-form" class="flex flex-col gap-4.5">
        <div>
          <label class="form-label" for="login-email">Email Address</label>
          <input id="login-email" type="email" class="form-input" placeholder="john@company.com" required>
        </div>

        <div>
          <div class="flex justify-between items-center mb-1.5">
            <label class="form-label mb-0" for="login-password">Password</label>
            <a href="forgot-password.html" class="text-xs text-[#E11D48] no-underline font-medium transition-colors duration-200">Forgot password?</a>
          </div>
          <div class="relative">
            <input id="login-password" type="password" class="form-input" placeholder="••••••••" required>
            <button type="button" id="toggle-pw" class="absolute right-3 top-1/2 -translate-y-1/2 border-none bg-transparent cursor-pointer text-[var(--muted)] p-0 transition-colors duration-200" aria-label="Toggle password">
              <svg id="eye-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div class="flex items-center gap-2">
          <input type="checkbox" id="remember-me" checked class="w-4 h-4 accent-[#E11D48] cursor-pointer">
          <label for="remember-me" class="text-[13px] text-[var(--text)] cursor-pointer">Remember me for 30 days</label>
        </div>

        <button type="submit" class="btn btn-primary btn-lg w-full justify-center mt-1">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
          Sign In
        </button>
      </form>

      <div class="auth-divider text-center">
        <span class="text-[13px] text-[var(--muted)]">Don't have an account? </span>
        <a href="register.html" class="text-[13px] text-[#E11D48] font-semibold no-underline transition-opacity duration-200">Create account</a>
      </div>
    </div>

    
  </div>

  <div id="toast-container" class="fixed bottom-5 right-5 z-[200] flex flex-col gap-2.5"></div>

  <script src="../assets/js/app.js"></script>
  <script>
    // No layout injection needed for auth pages
    (function() {
      if (localStorage.getItem('sf_theme') === 'dark') {
        document.documentElement.classList.add('dark');
      }
    })();

    const form = document.getElementById('login-form');
    form.addEventListener('submit', function(e) {
      e.preventDefault();
      const btn = form.querySelector('button[type=submit]');
      const label = btn.innerHTML;
      btn.disabled = true; btn.textContent = 'Signing in...';
      fetch('../api/auth.php?action=login', {
        method: 'POST', credentials: 'same-origin',
        headers: {'Content-Type': 'application/json', 'X-Requested-With': 'fetch'},
        body: JSON.stringify({email: document.getElementById('login-email').value, password: document.getElementById('login-password').value})
      }).then(r => r.json().then(d => ({ok: r.ok, d})))
        .then(({ok, d}) => {
          if (!ok) throw new Error(d.error || 'Login failed');
          window.location.href = '../dashboard.html';
        })
        .catch(err => { btn.disabled = false; btn.innerHTML = label; Toast.error(err.message, 'Sign in failed'); });
    });

    document.getElementById('toggle-pw').addEventListener('click', function() {
      const pw = document.getElementById('login-password');
      pw.type = pw.type === 'password' ? 'text' : 'password';
    });

    // Initialize Toast
    document.addEventListener('DOMContentLoaded', () => Toast.init());
  </script>
</body>
</html>
