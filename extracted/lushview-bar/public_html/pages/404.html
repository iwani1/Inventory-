<!DOCTYPE html>
<html lang="en" class="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Not Found — Lush View Bar</title>
  <meta name="description" content="Page not found — Lush View Bar — POS & Inventory.">
  <link rel="stylesheet" href="../assets/css/app.css">
  <link rel="stylesheet" href="../assets/css/tailwind.css">
  <script>try{if(localStorage.getItem('sf_theme')==="dark"){document.documentElement.classList.add("dark")}else{document.documentElement.classList.remove("dark")}}catch(e){}</script>
</head>
<body class="auth-body text-center">
  <div class="max-w-[520px] w-full">
    <div class="text-center text-[120px] font-black text-[var(--primary)] leading-none mb-0 opacity-25">404</div>
    <div class="auth-card -mt-5 relative z-[1] px-7 py-9">
      <div class="stat-icon icon-bg-primary w-[72px] h-[72px] rounded-[20px] mx-auto mb-5">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </div>
      <h1 class="auth-title text-[26px] mb-2.5">Page Not Found</h1>
      <p class="auth-subtitle leading-relaxed mb-7">The page you're looking for doesn't exist or has been moved to another location.</p>
      <div class="flex gap-3 justify-center flex-wrap">
        <a href="../dashboard.html" class="btn btn-primary btn-lg" aria-label="Go to dashboard">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          Go to Dashboard
        </a>
        <button class="btn btn-secondary btn-lg" aria-label="Go back to previous page" onclick="history.back()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          Go Back
        </button>
      </div>
    </div>
  </div>
  <script src="../assets/js/app.js"></script>
</body>
</html>
