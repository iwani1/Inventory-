<!DOCTYPE html>
<html lang="en" class="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — Lush View Bar</title>
  <meta name="description" content="Set a new password for your Lush View Bar account.">
  <link rel="stylesheet" href="../assets/css/app.css">
  <link rel="stylesheet" href="../assets/css/tailwind.css">
  <script>try{if(localStorage.getItem('sf_theme')==="dark"){document.documentElement.classList.add("dark")}else{document.documentElement.classList.remove("dark")}}catch(e){}</script>
</head>
<body class="auth-body">
  <div class="w-full max-w-[420px]">
    <div class="auth-card">
      <div class="text-center mb-7">
        <div class="stat-icon icon-bg-primary w-16 h-16 rounded-[20px] mx-auto mb-4">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
        </div>
        <h1 class="auth-title">Reset Password</h1>
        <p class="auth-subtitle">Enter your new password below.</p>
      </div>
      <form id="reset-form" class="flex flex-col gap-4">
        <div>
          <label class="form-label" for="new-pw">New Password</label>
          <input id="new-pw" type="password" class="form-input" placeholder="Min. 8 characters" required>
        </div>
        <div>
          <label class="form-label" for="confirm-pw">Confirm New Password</label>
          <input id="confirm-pw" type="password" class="form-input" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary btn-lg w-full justify-center mt-1">
          Reset Password
        </button>
      </form>
      <div class="text-center mt-5">
        <a href="login.html" class="text-[13px] text-[#E11D48] font-medium no-underline">← Back to Sign In</a>
      </div>
    </div>
  </div>
  <div id="toast-container" class="fixed bottom-5 right-5 z-[200] flex flex-col gap-2.5"></div>
  <script src="../assets/js/app.js"></script>
  <script>
    (function() { try { if (localStorage.getItem('sf_theme') === 'dark') document.documentElement.classList.add('dark'); } catch(e) {} })();
    document.addEventListener('DOMContentLoaded', () => Toast.init());
    document.getElementById('reset-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const pw = document.getElementById('new-pw').value;
      const cpw = document.getElementById('confirm-pw').value;
      if (pw !== cpw) { Toast.error('Passwords do not match.'); return; }
      if (pw.length < 8) { Toast.error('Password must be at least 8 characters.'); return; }
      Toast.success('Password reset successfully!', 'Success');
      setTimeout(() => window.location.href = 'login.html', 1500);
    });
  </script>
</body>
</html>
