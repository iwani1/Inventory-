<!DOCTYPE html>
<html lang="en" class="">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — Lush View Bar</title>
  <meta name="description" content="Create your Lush View Bar account.">
  <link rel="stylesheet" href="../assets/css/app.css">
  <link rel="stylesheet" href="../assets/css/tailwind.css">
  <script>try{if(localStorage.getItem('sf_theme')==="dark"){document.documentElement.classList.add("dark")}else{document.documentElement.classList.remove("dark")}}catch(e){}</script>
</head>
<body class="auth-body">

  <div class="w-full max-w-[480px]">
    <div class="text-center mb-7">
      <div class="auth-logo-wrap inline-flex items-center gap-3">
        <div class="w-[44px] h-[44px] rounded-xl bg-gradient-to-br from-[#E11D48] to-[#BE123C] flex items-center justify-center shadow-[0_4px_14px_rgba(225,29,72,0.35)]">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4.6 4.4h14.8L12 12.6 4.6 4.4z" fill="white" fill-opacity="0.25"/>
            <path d="M3.4 4.4h17.2" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M5.2 4.4L12 12.4l6.8-8" stroke="white" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
            <path d="M12 12.4V19" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M8.4 19.6h7.2" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
            <circle cx="17.6" cy="7.4" r="1.5" fill="white"/>
          </svg>
        </div>
        <div class="text-left border-l border-[var(--border)] pl-3">
          <div class="text-xl font-bold text-[var(--text)] leading-[1.1] tracking-[-0.3px]">Lush View Bar</div>
          <div class="text-[10px] text-[var(--primary)] font-semibold tracking-[0.8px] uppercase mt-0.5">Inventory Management</div>
        </div>
      </div>
    </div>

    <div class="auth-card">
      <div class="text-center mb-7">
        <h1 class="auth-title">Create Account</h1>
        <p class="auth-subtitle">Join your team on Lush View Bar inventory.</p>
      </div>

      <form id="register-form" class="flex flex-col gap-4">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="form-label" for="reg-first">First Name</label>
            <input id="reg-first" type="text" class="form-input" placeholder="First Name" required>
          </div>
          <div>
            <label class="form-label" for="reg-last">Last Name</label>
            <input id="reg-last" type="text" class="form-input" placeholder="Last Name" required>
          </div>
        </div>
        <div>
          <label class="form-label" for="reg-email">Email Address</label>
          <input id="reg-email" type="email" class="form-input" placeholder="user@company.com" required>
        </div>
        <div>
          <label class="form-label" for="reg-password">Password</label>
          <input id="reg-password" type="password" class="form-input" placeholder="Min. 8 characters" required minlength="8">
        </div>
        <div>
          <label class="form-label" for="reg-confirm">Confirm Password</label>
          <input id="reg-confirm" type="password" class="form-input" placeholder="••••••••" required minlength="8">
        </div>
        <button type="submit" id="reg-btn" class="btn btn-primary btn-lg w-full justify-center mt-1">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          Create Account
        </button>
      </form>

      <div class="auth-divider text-center">
        <span class="text-[13px] text-[var(--muted)]">Already have an account? </span>
        <a href="login.html" class="text-[13px] text-[#E11D48] font-semibold no-underline">Sign in</a>
      </div>
    </div>
  </div>

  <div id="toast-container" class="fixed bottom-5 right-5 z-[200] flex flex-col gap-2.5"></div>
  <script src="../assets/js/app.js"></script>
  <script>
    (function() { try { if (localStorage.getItem('sf_theme') === 'dark') document.documentElement.classList.add('dark'); } catch(e) {} })();
    document.addEventListener('DOMContentLoaded', () => Toast.init());
    document.getElementById('register-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const first = document.getElementById('reg-first').value.trim();
      const last = document.getElementById('reg-last').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;
      const confirm = document.getElementById('reg-confirm').value;
      const btn = document.getElementById('reg-btn');

      if (password !== confirm) { Toast.error('Passwords do not match.', 'Validation Error'); return; }
      if (password.length < 8) { Toast.error('Password must be at least 8 characters.', 'Validation Error'); return; }

      btn.disabled = true;
      btn.textContent = 'Creating account...';

      try {
        const res = await fetch('../api/auth.php?action=register', {
          method: 'POST',
          headers: {'Content-Type': 'application/json', 'X-Requested-With': 'fetch'},
          body: JSON.stringify({ first_name: first, last_name: last, email: email, password: password })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'Registration failed');
        Toast.success('Account created successfully! Redirecting to login...', 'Welcome');
        setTimeout(() => window.location.href = 'login.html', 1200);
      } catch (err) {
        Toast.error(err.message, 'Registration Failed');
        btn.disabled = false;
        btn.textContent = 'Create Account';
      }
    });
  </script>
</body>
</html>
